<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account | Tristan Merson</title>
  <link rel="stylesheet" href="account.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="account.js" defer></script>
</head>
<body>
  <header class="account-header">
    <a href="index.html">Tristan Merson</a>
    <nav aria-label="Account navigation">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
    </nav>
  </header>

  <main class="card">
    <p class="eyebrow">Your account</p>
    <h1 id="title">Create an account</h1>
    <p id="message">Create an account to keep your details ready for future orders and game scores.</p>

    <form id="account-form">
      <label id="name-field">Display name<input id="name" required maxlength="80" autocomplete="name"></label>
      <label>Email<input id="email" type="email" required autocomplete="email"></label>
      <label>Password<input id="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <button type="submit" id="submit-button">Create account</button>
    </form>

    <section id="profile-panel" hidden aria-labelledby="profile-title">
      <h2 id="profile-title">Profile</h2>
      <dl class="profile-details">
        <div><dt>Name</dt><dd id="profile-name">—</dd></div>
        <div><dt>Email</dt><dd id="profile-email">—</dd></div>
        <div><dt>Member since</dt><dd id="profile-created">—</dd></div>
      </dl>
      <h2>My dice scores</h2>
      <p id="score-message">Loading your scores…</p>
      <ol id="personal-scores" class="personal-scores"></ol>
    </section>

    <p id="status" role="status"></p>
    <p class="account-links"><a href="#" id="switch">Already have an account? Sign in</a> · <a href="#" id="forgot">Forgot password?</a></p>
    <button id="logout" hidden>Log out</button>
  </main>
</body>
</html>
