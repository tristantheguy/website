<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Tristan Merson</title><link rel="stylesheet" href="account.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="account.js" defer></script></head><body><main class="card"><a href="shop.html">← Shop</a><p class="eyebrow">Your account</p><h1 id="title">Create an account</h1><p id="message">Create an account to keep your details ready for future orders.</p><form id="account-form"><label>Display name<input id="name" required maxlength="80"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><button type="submit">Create account</button></form><p id="status" role="status"></p><p><a href="#" id="switch">Already have an account? Sign in</a> · <a href="#" id="forgot">Forgot password?</a></p><button id="logout" hidden>Log out</button></main></body></html>
